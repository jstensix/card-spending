[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.14"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
lifecycle = "2.11.0"
navigationCompose = "2.10.2"
room = "2.8.5"
work = "2.12.0"
playServicesAuth = "22.0.0"
okhttp = "5.5.1"
